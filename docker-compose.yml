services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports: ["1433:1433"]
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ./backend/PlayHub.Api
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=PlayHub;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};TrustServerCertificate=True;Encrypt=True"
      Authentication__SigningKey: ${PLAYHUB_SIGNING_KEY:?Set PLAYHUB_SIGNING_KEY in .env}
      BootstrapAdmin__Email: ${PLAYHUB_ADMIN_EMAIL:?Set PLAYHUB_ADMIN_EMAIL in .env}
      BootstrapAdmin__Password: ${PLAYHUB_ADMIN_PASSWORD:?Set PLAYHUB_ADMIN_PASSWORD in .env}
      AllowedOrigins__0: http://localhost:5173
      AllowedOrigins__1: http://localhost:5176
    ports: ["5280:8080"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend/playhub-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5280/api/v1
    environment:
      PLAYHUB_API_URL: http://api:8080/api/v1
      PLAYHUB_GAME_ORIGIN: http://localhost:5174
    ports: ["5173:3000"]
    depends_on:
      api:
        condition: service_started
  console:
    build:
      context: ./frontend/playhub-console
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5280/api/v1
    ports: ["5176:3000"]
    depends_on:
      api:
        condition: service_started
  game:
    build:
      context: ./games/pool-game
      dockerfile: Dockerfile
    ports: ["5174:80"]

volumes:
  sql_data:
